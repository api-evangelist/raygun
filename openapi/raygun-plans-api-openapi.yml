openapi: 3.2.0
info:
  title: Raygun Plans API
  version: '3.0'
  description: 'This is a visual representation of the Raygun API V3 specification.

    To find out more details and how to get started, you can head over to the documentation.'
  contact:
    name: Raygun Support
    email: support@raygun.com
servers:
- url: https://api.raygun.com/v3
  description: ''
security:
- personal_access_token: []
tags:
- name: Plans
paths:
  /plans:
    get:
      summary: List Plans
      tags:
      - Plans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/plan'
        '401':
          $ref: '#/components/responses/problem-details'
        '403':
          $ref: '#/components/responses/problem-details'
        '429':
          description: Too many requests
      operationId: list-plans
      description: Returns a list of plans that this token can access
      security:
      - personal_access_token: []
components:
  responses:
    problem-details:
      description: Problem Details
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              detail:
                type: string
              status:
                type: integer
              traceId:
                type: string
            required:
            - type
            - title
            - status
            - traceId
      headers:
        X-Raygun-RequestId:
          schema:
            type: string
          description: The id associated with this request
  schemas:
    plan:
      title: plan
      type: object
      properties:
        identifier:
          type: string
      required:
      - identifier
  securitySchemes:
    personal_access_token:
      type: http
      scheme: bearer
      description: 'Personal Access Token authorization using the Bearer scheme. Example: `Authorization: Bearer {token}`'
